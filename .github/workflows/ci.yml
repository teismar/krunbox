name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            desktop-file-utils \
            appstream \
            podman

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Link system PyGObject bindings
        run: |
          PYTHON_SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          sudo ln -sf /usr/lib/python3/dist-packages/gi "$PYTHON_SITE/gi" || true
          sudo ln -sf /usr/lib/python3/dist-packages/cairo "$PYTHON_SITE/cairo" || true

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          make install

      - name: Run Validations and Test Suite
        run: make check
