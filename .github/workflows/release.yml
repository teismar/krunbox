name: Release & Distribution Packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

jobs:
  build-python:
    name: Build Python Packages
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  build-deb:
    name: Build DEB Package (Ubuntu / Debian)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build Debian package
        run: ./packaging/build-deb.sh

      - name: Validate Debian package
        run: dpkg-deb -I dist/*.deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-rpm:
    name: Build RPM Package (Fedora 45 / RHEL)
    runs-on: ubuntu-latest
    container:
      image: fedora:45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install RPM build tools and dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build python3-devel python3-setuptools python3-wheel \
            desktop-file-utils libappstream-glib python3-pip python3-build git

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPM package
        run: ./packaging/build-rpm.sh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  github-release:
    name: Create GitHub Release & Attach Assets
    needs: [build-python, build-deb, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine release version tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract Changelog for Release
        id: changelog
        run: |
          python3 packaging/extract-changelog.py "${{ steps.version.outputs.tag }}" --output RELEASE_NOTES.md
          echo "=== Release Notes for ${{ steps.version.outputs.tag }} ==="
          cat RELEASE_NOTES.md

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.tar.gz
            release-assets/*.whl
