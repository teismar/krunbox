name: Bug Report
description: Report an issue or unexpected behavior in krunbox
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with krunbox. Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the behavior.
      placeholder: |
        1. Run `krunbox run ...`
        2. Execute `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: doctor-output
    attributes:
      label: Output of `krunbox doctor`
      description: Run `krunbox doctor` and paste the output here.
      render: shell
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS distribution, kernel version, Podman version, and Libadwaita version.
      placeholder: |
        - Linux Distribution: Fedora 44 / Ubuntu 24.04
        - Kernel: 6.x
        - Podman: 5.x
    validations:
      required: true
